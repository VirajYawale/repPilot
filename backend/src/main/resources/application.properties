spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/repopilot}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# Local chat model
spring.ai.ollama.chat.options.model=llama3.2

# Local embedding model for RAG
spring.ai.ollama.embedding.options.model=nomic-embed-text


# OAuth2 - GitHub
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:Ov23liAaj4Bu8mtLgCgF}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:75e3bc91ed38123f3c0fd0619f826aaa3a92a112}
spring.security.oauth2.client.registration.github.scope=read:user,repo
spring.security.oauth2.client.registration.github.user-name-attribute=id

server.servlet.session.cookie.name=DEVPILOT_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d

# PgVector
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimension=768
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE-DISTANCE

# App Config
app.frontend-url=http://localhost:3000
app.cors.allowed-origins=http://localhost:3000
app.cors.allowed-headers=Authorization, Content-Type, Accept, X-Requested-With
app.cors.exposed-headers=Authorization, Set-Cookie


# Token Encryptor
app.token.encryptor.password=${ENCRYPTOR_PASSWORD:kr/zfcFLUw/IKdlTjKAmaAA/BX4FJA5YNnStLziAECk}
app.token.encryptor.salt=${ENCRYPTOR_SALT:c61748a2b1956c23be2dd104be2a7c85}

# Indexing
app.indexing.max-file-bytes=102400
app.indexing.chunk-size=800
app.indexing.chunk-overlap=100
app.github.api-delay-ms=50

server.port=${SERVER_PORT:8080}