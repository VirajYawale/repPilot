services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: repopilot-postgres
    environment:
      POSTGRES_DB: repopilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - repopilot_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-intitdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d repopilot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  repopilot_pg_data: